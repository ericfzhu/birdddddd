<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#211a1d" />
    <meta name="description" content="birdddddd — Flappy Bird meets VVVVVV in a one-button gravity arcade game." />
    <title>birdddddd</title>
  </head>
  <body>
    <main class="page-shell" id="game-content">
      <section class="game-shell" aria-label="birdddddd game">
        <div id="game" aria-label="Game canvas">
          <div class="game-hud" aria-hidden="true">
            <div class="hud-text hud-title" id="hud-title">BIRDDDDDD</div>
            <div class="hud-text hud-prompt" id="hud-prompt">TAP TO FLIP GRAVITY</div>
            <div class="hud-text hud-score hud-top" id="hud-score">0</div>
            <div class="hud-text hud-chapter" id="hud-chapter">VERDANT WILDS</div>
            <div class="hud-text hud-result" id="hud-result"></div>
            <div class="hud-text hud-helper" id="hud-helper"></div>
          </div>
          <div class="game-controls" aria-label="Game controls">
            <button class="hud-control hud-control-pause" id="hud-pause" type="button" aria-label="Pause game" data-state="playing">
              <svg class="hud-control-icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="4" width="5" height="16"></rect>
                <rect x="14" y="4" width="5" height="16"></rect>
              </svg>
              <svg class="hud-control-icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4.5 20 12 7 19.5Z"></path>
              </svg>
            </button>
            <button class="hud-control hud-control-sound" id="hud-sound" type="button" aria-label="Mute sound" data-state="audible">
              <svg class="hud-control-icon icon-audible" viewBox="0 0 24 24" aria-hidden="true">
                <path class="speaker-body" d="M3 9h4l5-4v14l-5-4H3Z"></path>
                <path class="speaker-wave" d="M15 8.5a5 5 0 0 1 0 7"></path>
                <path class="speaker-wave" d="M18 6a8 8 0 0 1 0 12"></path>
              </svg>
              <svg class="hud-control-icon icon-muted" viewBox="0 0 24 24" aria-hidden="true">
                <path class="speaker-body" d="M3 9h4l5-4v14l-5-4H3Z"></path>
                <path class="mute-mark" d="m16 9 5 6m0-6-5 6"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>
    <aside class="rotate-prompt" id="rotate-prompt" role="status" aria-live="polite" aria-hidden="true">
      <div class="rotate-machine" aria-hidden="true">
        <span class="rotate-phone"></span>
        <span class="rotate-arrow">↻</span>
      </div>
      <strong>Rotate to landscape</strong>
      <span>Turn your phone sideways to enter the wilds.</span>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

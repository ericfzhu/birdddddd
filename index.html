<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17182b" />
    <meta name="description" content="Impossible Aviary — a one-button gravity arcade game." />
    <title>Impossible Aviary</title>
  </head>
  <body>
    <main class="page-shell" id="game-content">
      <section class="game-shell" aria-label="Impossible Aviary game">
        <div id="game" aria-label="Game canvas"></div>
      </section>
    </main>
    <aside class="rotate-prompt" id="rotate-prompt" role="status" aria-live="polite" aria-hidden="true">
      <div class="rotate-machine" aria-hidden="true">
        <span class="rotate-phone"></span>
        <span class="rotate-arrow">↻</span>
      </div>
      <strong>Rotate to landscape</strong>
      <span>Turn your phone sideways to open the aviary.</span>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
